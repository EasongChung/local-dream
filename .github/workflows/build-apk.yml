name: Cloud Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_API_LEVEL: "37"
      ANDROID_NDK_VERSION: "28.0.13004108"
      ANDROID_NDK_DIT_VERSION: "29.0.14206865"
      QNN_VERSION: "2.51.0.260929"
      QNN_SHA256: "9b4ca798902f02a2543857f5de4d233830c044d19701b92fc66a12fdc292211f"
      HEXAGON_SDK_VERSION: "6.7.0.0"
      HEXAGON_SDK_SHA256: "00725fc449916d7b9af2c2a3c6b54d61f3c872d5dbc1d3ca3fd2f839b1d5dc70"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip cmake ninja-build libgmp10

      - name: Install Android platform, build-tools and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-37.0" "build-tools;35.0.0" \
            "ndk;28.0.13004108" "ndk;${ANDROID_NDK_DIT_VERSION}"
          # AGP resolves compileSdk = 37 to platforms/android-37; the SDK
          # package installs as android-37.0, so provide the expected alias.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Resolve Android paths
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/28.0.13004108"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK: $NDK_DIR"
          test -d "$NDK_DIR"
          sudo mkdir -p /data
          sudo ln -sfn "$NDK_DIR" /data/android-ndk-r28
          which ninja || true

      - name: Download QAIRT (QNN) SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qairt"
          cd "$RUNNER_TEMP/qairt"
          URL="https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QNN_VERSION}/v${QNN_VERSION}.zip"
          wget -O qairt.zip "$URL"
          echo "${QNN_SHA256}  qairt.zip" | sha256sum -c -
          unzip -q qairt.zip -d extracted
          QNN_ROOT="$RUNNER_TEMP/qairt/extracted/qairt/${QNN_VERSION}"
          echo "QNN_SDK_ROOT=$QNN_ROOT" >> $GITHUB_ENV
          test -d "$QNN_ROOT/examples/QNN/SampleApp/SampleApp"
          echo "QNN SDK ready: $QNN_ROOT"

      - name: Install Rust Android target
        run: |
          # tokenizers-cpp's C wrapper predates Rust's dangerous_implicit_autorefs
          # lint (Rust 1.88+), so pin a compatible toolchain.
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.85.0
          echo "RUSTUP_TOOLCHAIN=1.85.0" >> $GITHUB_ENV
          rustup run 1.85.0 rustc --version
          rustup target list --installed --toolchain 1.85.0

      - name: Build native library
        working-directory: app/src/main/cpp
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh

      # The core build above does not produce the DiT engine: libdit_engine.so
      # and its Hexagon skels are a separate project (app/src/main/cpp/dit) that
      # needs the Hexagon SDK. Without them, every DiT model (Z-Image, Klein,
      # Qwen Image 2.1, Krea 2) fails at DitEngine.isInstalled() on SM8750+.
      - name: Free QNN SDK after native build
        run: rm -rf "$RUNNER_TEMP/qairt"

      - name: Download Hexagon SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hexagon"
          cd "$RUNNER_TEMP/hexagon"
          ARCHIVE="hexagon-sdk-v${HEXAGON_SDK_VERSION}-amd64-lnx.tar.xz"
          URL="https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v${HEXAGON_SDK_VERSION}/${ARCHIVE}"
          wget -q -O "$ARCHIVE" "$URL"
          echo "${HEXAGON_SDK_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xJf "$ARCHIVE"
          rm -f "$ARCHIVE"
          SDK_ROOT="$RUNNER_TEMP/hexagon/${HEXAGON_SDK_VERSION}"
          test -f "$SDK_ROOT/hexagon_sdk.json"
          echo "HEXAGON_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "Hexagon SDK ready: $SDK_ROOT"

      - name: Build DiT engine
        working-directory: app/src/main/cpp
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${ANDROID_NDK_DIT_VERSION}"
          test -d "$ANDROID_NDK_ROOT"
          test -d "$HEXAGON_SDK_ROOT"
          chmod +x dit/build.sh
          bash dit/build.sh
          test -f ../jniLibs/arm64-v8a/libdit_engine.so
          test -f ../assets/ditlibs/libggml-htp-v79.so
          test -f ../assets/ditlibs/libggml-htp-v81.so
          test -f ../assets/ditlibs/libggml-htp-v85.so
          ls -lh ../jniLibs/arm64-v8a ../assets/ditlibs

      # Reclaim the SDK/NDK/build trees before Gradle; the APK only needs the
      # staged .so files under jniLibs and assets.
      - name: Clean heavy build inputs
        run: |
          rm -rf "$RUNNER_TEMP/hexagon"
          rm -rf "$ANDROID_HOME/ndk/${ANDROID_NDK_DIT_VERSION}"
          rm -rf app/src/main/cpp/build app/src/main/cpp/dit/build

      - name: Generate release keystore
        working-directory: app
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias localdream \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cloudbuild -keypass cloudbuild \
            -dname "CN=LocalDream,O=CloudBuild,C=US"

      - name: Build APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleBasicRelease assembleFilterRelease --no-daemon \
            -PRELEASE_STORE_FILE=keystore.jks \
            -PRELEASE_STORE_PASSWORD=cloudbuild \
            -PRELEASE_KEY_ALIAS=localdream \
            -PRELEASE_KEY_PASSWORD=cloudbuild

      - name: Verify APK contains DiT engine
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          required = {
              "lib/arm64-v8a/libstable_diffusion_core.so",
              "lib/arm64-v8a/libdit_engine.so",
              "assets/ditlibs/libggml-htp-v79.so",
              "assets/ditlibs/libggml-htp-v81.so",
              "assets/ditlibs/libggml-htp-v85.so",
          }
          apks = glob.glob("app/build/outputs/apk/**/*.apk", recursive=True)
          if not apks:
              sys.exit("no APK found")
          for path in apks:
              with zipfile.ZipFile(path) as z:
                  names = set(z.namelist())
              missing = required - names
              if missing:
                  sys.exit(f"{path}: missing {sorted(missing)}")
              print(f"{path}: OK ({len(names)} entries)")
          PY

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-dream-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error